name: ci
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc libsqlite3-dev
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run test:native-crypto
      - run: bun run test:native-base64
      - run: bun run test:native-model-resolver
      - run: bun run test:native-streams
      - run: bun run test:native-timers
      - run: bun run test:native-iterators
      - run: bun run test:native-utf8
      - run: bun run test:native-response-defaults
      - run: bun run test:native-raw-body
      - run: bun run test:native-url
      - run: bun run test:native-json
      - run: bun run test:native-errors
      - run: bun run test:native-request
