name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # The changesets bot's "Version Packages" PR only deletes .changeset/*.md and
    # bumps versions and CHANGELOGs. GitHub opens it as github-actions[bot], so
    # every ci run it triggers waits for a maintainer's approval
    # (action_required), and the one still waiting when the PR is merged is
    # closed as a failure with no jobs, which GitHub reports as "workflow file
    # issue". That PR changes no code: main already passed every job below in
    # the PRs that were merged into it, and release.yml reran typecheck, lint
    # and the unit and native tests on it before opening the PR. So ci skips a
    # PR that touches only these files.
    # A human PR that changes nothing else is skipped too: run ci by touching
    # any other file, or with workflow_dispatch.
    paths-ignore:
      - ".changeset/*.md"
      - "packages/*/CHANGELOG.md"
      - "packages/*/package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Same skip as paths-ignore above, for a release PR that ever touches more.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc libsqlite3-dev
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  native:
    name: native (${{ matrix.channel }})
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    # Standalone builds default to Porffor alpha 23; alpha 22 (othello's generation until its swap) and the
    # alpha 19 fallback pin (SPROUTBOAT_PORFFOR_CHANNEL=alpha-19) are tested until they are dropped.
    strategy:
      fail-fast: false
      matrix:
        channel: [alpha-23, alpha-22, alpha-19]
    env:
      SPROUTBOAT_PORFFOR_CHANNEL: ${{ matrix.channel }}
      SB_NATIVE_CC_STRICT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # clang and the arm64 cross headers: test:native-cc compiles the units to LLVM IR for aarch64 as well.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc clang libc6-dev-arm64-cross libsqlite3-dev
      - run: bun install --frozen-lockfile
      # The patched Porffor toolchain, and the uWebSockets checkout and uSockets.a
      # its native compiles build on first use. The toolchain's directory is
      # named after the patch fingerprint, so a stale entry is never used.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/sproutboat/porffor-*
            ~/.cache/porffor/deps
          key: porffor-${{ matrix.channel }}-${{ runner.os }}-${{ hashFiles('packages/toolchain/package.json', 'packages/toolchain/src/**/*.ts', 'packages/toolchain/src/**/*.c', 'packages/toolchain/src/**/*.js', 'packages/toolchain/vendor/**') }}
      # BearSSL is read from vendor/bearssl (sha256-pinned in packages/toolchain/src/deps.ts), so this
      # job needs no network for it; bearssl.org is only a fallback.
      # Every test:native-* script, 4 at a time (scripts/test-native.ts).
      - run: bun run test:native

  # Alpha 23 prefixes generated functions with swiftcall on clang arm64 (PORF_CC), and the CLI's host and
  # release builds link with -flto. A host C call without the same convention compiled, linked and then
  # trapped at startup on macOS arm64 only when LTO saw both sides. The ubuntu job above never links with
  # LTO and has no arm64, so the two checks that cover it run here on the real platform.
  native-macos:
    name: native (macOS arm64, alpha-23)
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.head_ref != 'changeset-release/main'
    runs-on: macos-latest
    env:
      SPROUTBOAT_PORFFOR_CHANNEL: alpha-23
      SB_NATIVE_CC_STRICT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/sproutboat/porffor-*
            ~/.cache/porffor/deps
          key: porffor-alpha-23-${{ runner.os }}-${{ hashFiles('packages/toolchain/package.json', 'packages/toolchain/src/**/*.ts', 'packages/toolchain/src/**/*.c', 'packages/toolchain/src/**/*.js', 'packages/toolchain/vendor/**') }}
      - run: bun run test:native lto cc

  # The published packages' consumer: sproutboat-cli's kitchen-sink app, built
  # against this PR's packages. Its compatibility_date is 2026-08-26, so it is
  # the "an app written before a behaviour change keeps working" check that
  # caught the last three regressions only after they were published.
  downstream:
    name: downstream (sproutboat-cli kitchen-sink)
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: baronunread/sproutboat-cli
          # Set the SPROUTBOAT_CLI_REF repository variable to test against a CLI
          # branch, e.g. one already adapted to a breaking change in this PR.
          ref: ${{ vars.SPROUTBOAT_CLI_REF || 'main' }}
          path: sproutboat-cli
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc libsqlite3-dev
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: sproutboat-cli
      - name: Point the CLI's @sproutboat packages at this PR
        working-directory: sproutboat-cli
        run: |
          for dir in "$GITHUB_WORKSPACE"/packages/*; do
            name="$(jq -r .name "$dir/package.json")"
            target="node_modules/$name"
            [ -e "$target" ] || continue
            rm -rf "$target"
            ln -s "$dir" "$target"
            resolved="$(bun -e "console.log(Bun.resolveSync('$name', process.cwd()))")"
            echo "$name -> $resolved"
            case "$resolved" in
              "$dir"/*) ;;
              *) echo "::error::$name still resolves outside this PR: $resolved"; exit 1 ;;
            esac
          done
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/sproutboat/porffor-*
            ~/.cache/porffor/deps
          key: porffor-${{ runner.os }}-${{ hashFiles('packages/toolchain/package.json', 'packages/toolchain/src/*.ts', 'packages/toolchain/vendor/**') }}
      - run: bun run kitchen-sink
        working-directory: sproutboat-cli
      - run: bun run kitchen-sink:standalone
        working-directory: sproutboat-cli
